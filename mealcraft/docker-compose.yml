services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3080:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-anthropic/claude-sonnet-4}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/mealcraft.db}
      - CALORIE_TARGET=${CALORIE_TARGET:-2500}
      - MAX_DIFFICULTY=${MAX_DIFFICULTY:-medium}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - mealcraft_data:/app/data
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  mealcraft_data:
