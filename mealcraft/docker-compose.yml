services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/mealcraft.db}
      - CALORIE_TARGET=${CALORIE_TARGET:-2500}
      - MAX_DIFFICULTY=${MAX_DIFFICULTY:-medium}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - mealcraft_data:/app/data
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

volumes:
  mealcraft_data:

networks:
  internal:
    driver: bridge
